global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: prod

rule_files:
  - /etc/prometheus/rules/*.yml

# Replace <DB_PRIVATE_IP> with the private IP of the MySQL server.
# The instance label must match the one used by the dashboards (db-replica-01).
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: node
    static_configs:
      - targets: ['<DB_PRIVATE_IP>:9100']
        labels:
          instance: db-replica-01

  - job_name: mysql
    static_configs:
      - targets: ['<DB_PRIVATE_IP>:9104']
        labels:
          instance: db-replica-01

  - job_name: slowlog
    static_configs:
      - targets: ['<DB_PRIVATE_IP>:9105']
        labels:
          instance: db-replica-01
